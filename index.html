<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #4ecca3;
      margin-bottom: 20px;
      font-size: 2.5rem;
    }

    .menu, .gameover {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: rgba(26, 26, 46, 0.9);
      border-radius: 20px;
      border: 2px solid #4ecca3;
      width: 100%;
      max-width: 400px;
    }

    .difficulty {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .btn {
      padding: 15px 30px;
      background: transparent;
      border: 2px solid #4ecca3;
      color: #4ecca3;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .btn:hover, .btn.active {
      background: #4ecca3;
      color: #1a1a2e;
    }

    .desc {
      color: #ccc;
      margin-bottom: 20px;
      text-align: center;
    }

    .start-btn {
      padding: 20px 60px;
      background: linear-gradient(135deg, #4ecca3, #3db892);
      color: #1a1a2e;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin: 20px 0;
      transition: opacity 0.3s;
    }

    .start-btn:hover {
      opacity: 0.8;
    }

    .rules {
      margin-top: 20px;
      color: #ccc;
      text-align: center;
      line-height: 1.6;
    }

    .game {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .game.active {
      display: flex;
    }

    .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    .paused {
      color: #f39c12;
      font-weight: bold;
    }

    #gameCanvas {
      border: 2px solid #4ecca3;
      background-color: #16213e;
      max-width: 100%;
    }

    .d-pad-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
    }

    .d-pad {
      position: relative;
      width: 240px;
      height: 240px;
      background: rgba(78, 204, 163, 0.08);
      border-radius: 50%;
      border: 2px solid rgba(78, 204, 163, 0.4);
    }

    .d-btn {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
      border: 3px solid #4ecca3;
      color: #4ecca3;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .d-btn:hover {
      background: #4ecca3;
      color: #1a1a2e;
    }

    .d-btn:active {
      transform: scale(0.95);
    }

    .d-up { top: 15px; left: 50%; transform: translateX(-50%); }
    .d-down { bottom: 15px; left: 50%; transform: translateX(-50%); }
    .d-left { left: 15px; top: 50%; transform: translateY(-50%); }
    .d-right { right: 15px; top: 50%; transform: translateY(-50%); }
    .d-center { 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #4ecca3, #3db892);
      color: #1a1a2e;
      border: none;
      font-size: 28px;
    }

    .back {
      padding: 15px 40px;
      background: transparent;
      border: 2px solid #888;
      color: #888;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
    }

    .back:hover {
      background: rgba(136, 136, 136, 0.2);
    }

    .overlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      border: 2px solid #4ecca3;
      z-index: 100;
    }

    .overlay.active {
      display: block;
    }

    .msg {
      font-size: 1.5rem;
      color: #4ecca3;
      margin-bottom: 15px;
    }

    .sub {
      color: #ccc;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="menu" class="menu">
      <h1>🐍 贪吃蛇</h1>
      <div class="difficulty">
        <button class="btn active" onclick="setDifficulty('normal')">普通</button>
        <button class="btn" onclick="setDifficulty('hard')">困难</button>
      </div>
      <div class="desc" id="desc">200分/关 | 无障碍物</div>
      <button class="start-btn" onclick="startGame()">开始游戏</button>
      <div class="rules">
        <div>目标：<span id="targetScore">200分</span>过关，速度提升</div>
        <div>食物越大分数越高，最多5个</div>
      </div>
    </div>

    <div id="game" class="game">
      <div class="info">
        <div>关卡: <span id="level">1</span> | 速度: <span id="speed">2</span></div>
        <div>分数: <span id="score">0</span> | 本关: <span id="levelScore">0</span></div>
        <div id="pausedText" class="paused hidden">暂停</div>
      </div>
      
      <canvas id="gameCanvas" width="480" height="480"></canvas>

      <div class="d-pad-container">
        <div class="d-pad">
          <div class="d-btn d-up" onclick="changeDirection('up')">▲</div>
          <div class="d-btn d-left" onclick="changeDirection('left')">◀</div>
          <div class="d-btn d-center" onclick="togglePause()" id="pauseBtn">⏸</div>
          <div class="d-btn d-right" onclick="changeDirection('right')">▶</div>
          <div class="d-btn d-down" onclick="changeDirection('down')">▼</div>
        </div>
      </div>

      <button class="back" onclick="backToMenu()">返回菜单</button>
    </div>

    <div id="gameover" class="gameover hidden">
      <h1>游戏结束</h1>
      <div>关卡: <span id="finalLevel">1</span> | 分数: <span id="finalScore">0</span></div>
      <button class="start-btn" onclick="restartGame()">重新开始</button>
      <button class="back" onclick="backToMenu()">返回菜单</button>
    </div>

    <div id="levelOverlay" class="overlay">
      <div class="msg">🎉 第 <span id="completedLevel">1</span> 关通过！</div>
      <div class="sub">即将进入第 <span id="nextLevel">2</span> 关，速度提升</div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 30
    const CELL_SIZE = 16
    const CANVAS_SIZE = GRID_SIZE * CELL_SIZE
    
    const SPEED_LEVELS = { 1: 200, 2: 150, 3: 100, 4: 70, 5: 50 }
    
    const FOOD_TYPES = [
      { type: 'small', score: 5, size: 1, color: '#e74c3c', probability: 0.4 },
      { type: 'medium', score: 10, size: 2, color: '#f39c12', probability: 0.35 },
      { type: 'large', score: 20, size: 3, color: '#f1c40f', probability: 0.2 },
      { type: 'special', score: 50, size: 4, color: '#2ecc71', probability: 0.05 }
    ]

    const DIRECTIONS = {
      UP: { x: 0, y: -1 },
      DOWN: { x: 0, y: 1 },
      LEFT: { x: -1, y: 0 },
      RIGHT: { x: 1, y: 0 }
    }

    let gameState = 'menu'
    let difficulty = 'normal'
    let speedLevel = 2
    let currentLevel = 1
    let snake = []
    let foods = []
    let obstacles = []
    let direction = DIRECTIONS.RIGHT
    let nextDirection = DIRECTIONS.RIGHT
    let score = 0
    let levelScore = 0
    let isPaused = false
    let gameLoop = null

    const canvas = document.getElementById('gameCanvas')
    const ctx = canvas.getContext('2d')

    function setDifficulty(diff) {
      difficulty = diff
      document.querySelectorAll('.difficulty .btn').forEach(btn => btn.classList.remove('active'))
      event.target.classList.add('active')
      
      if (diff === 'normal') {
        document.getElementById('desc').textContent = '200分/关 | 无障碍物'
        document.getElementById('targetScore').textContent = '200分'
      } else {
        document.getElementById('desc').textContent = '100分/关 | 有障碍物'
        document.getElementById('targetScore').textContent = '100分'
      }
    }

    function getRandomPosition() {
      return {
        x: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
        y: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1
      }
    }

    function getRandomFoodType() {
      const random = Math.random()
      let cumulative = 0
      for (const foodType of FOOD_TYPES) {
        cumulative += foodType.probability
        if (random <= cumulative) return foodType
      }
      return FOOD_TYPES[1]
    }

    function generateFood() {
      let attempts = 0
      let food
      do {
        const pos = getRandomPosition()
        const type = getRandomFoodType()
        food = { ...pos, ...type, id: Date.now() + Math.random() }
        attempts++
      } while (
        attempts < 100 && (
          snake.some(s => s.x === food.x && s.y === food.y) ||
          foods.some(f => f.x === food.x && f.y === food.y) ||
          obstacles.some(o => o.x === food.x && o.y === food.y)
        )
      )
      return attempts < 100 ? food : null
    }

    function addObstacle() {
      const isHorizontal = Math.random() > 0.5
      let attempts = 0
      let obstacle

      do {
        const pos = {
          x: Math.floor(Math.random() * (GRID_SIZE - 6)) + 3,
          y: Math.floor(Math.random() * (GRID_SIZE - 6)) + 3
        }

        if (isHorizontal) {
          obstacle = [{ x: pos.x, y: pos.y }, { x: pos.x + 1, y: pos.y }]
        } else {
          obstacle = [{ x: pos.x, y: pos.y }, { x: pos.x, y: pos.y + 1 }]
        }
        attempts++
      } while (
        attempts < 50 && obstacle.some(o =>
          snake.some(s => s.x === o.x && s.y === o.y) ||
          foods.some(f => f.x === o.x && f.y === o.y) ||
          obstacles.some(oe => oe.x === o.x && oe.y === o.y)
        )
      )

      if (attempts < 50) obstacles.push(...obstacle)
    }

    function initGame() {
      snake = [{ x: 15, y: 15 }, { x: 14, y: 15 }, { x: 13, y: 15 }]
      direction = DIRECTIONS.RIGHT
      nextDirection = DIRECTIONS.RIGHT
      score = 0
      levelScore = 0
      foods = []
      obstacles = []
      isPaused = false

      for (let i = 0; i < 3; i++) {
        const food = generateFood()
        if (food) foods.push(food)
      }

      updateUI()
    }

    function startGame() {
      gameState = 'playing'
      currentLevel = 1
      speedLevel = 2
      
      document.getElementById('menu').classList.add('hidden')
      document.getElementById('gameover').classList.add('hidden')
      document.getElementById('game').classList.add('active')
      
      initGame()
      startGameLoop()
    }

    function startGameLoop() {
      if (gameLoop) clearInterval(gameLoop)
      gameLoop = setInterval(gameStep, SPEED_LEVELS[speedLevel])
    }

    function gameStep() {
      if (isPaused || gameState !== 'playing') return

      direction = nextDirection

      const head = { ...snake[0] }
      head.x += direction.x
      head.y += direction.y

      if (
        head.x < 0 || head.x >= GRID_SIZE ||
        head.y < 0 || head.y >= GRID_SIZE ||
        snake.slice(1).some(s => s.x === head.x && s.y === head.y) ||
        obstacles.some(o => o.x === head.x && o.y === head.y)
      ) {
        gameOver()
        return
      }

      snake.unshift(head)

      const foodIndex = foods.findIndex(f => f.x === head.x && f.y === head.y)
      if (foodIndex !== -1) {
        const food = foods[foodIndex]
        score += food.score
        levelScore += food.score
        foods.splice(foodIndex, 1)

        if (difficulty === 'hard' && score > 0 && score % 50 === 0) {
          addObstacle()
        }

        if (foods.length < 5) {
          const newFood = generateFood()
          if (newFood) foods.push(newFood)
        }

        const passScore = difficulty === 'normal' ? 200 : 100
        if (levelScore >= passScore) {
          levelUp()
          return
        }
      } else {
        snake.pop()
      }

      draw()
      updateUI()
    }

    function draw() {
      ctx.fillStyle = '#16213e'
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE)

      ctx.strokeStyle = 'rgba(78, 204, 163, 0.1)'
      ctx.lineWidth = 1
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath()
        ctx.moveTo(i * CELL_SIZE, 0)
        ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE)
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(0, i * CELL_SIZE)
        ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE)
        ctx.stroke()
      }

      obstacles.forEach(o => {
        const gradient = ctx.createLinearGradient(
          o.x * CELL_SIZE, o.y * CELL_SIZE,
          (o.x + 1) * CELL_SIZE, (o.y + 1) * CELL_SIZE
        )
        gradient.addColorStop(0, '#95a5a6')
        gradient.addColorStop(1, '#bdc3c7')
        ctx.fillStyle = gradient
        ctx.fillRect(o.x * CELL_SIZE, o.y * CELL_SIZE, CELL_SIZE, CELL_SIZE)
      })

      foods.forEach(f => {
        const r = (f.size * CELL_SIZE) / 2
        
        ctx.fillStyle = f.color + '40'
        ctx.beginPath()
        ctx.arc(
          f.x * CELL_SIZE + CELL_SIZE / 2,
          f.y * CELL_SIZE + CELL_SIZE / 2,
          r + 3, 0, Math.PI * 2
        )
        ctx.fill()

        ctx.fillStyle = f.color
        ctx.beginPath()
        ctx.arc(
          f.x * CELL_SIZE + CELL_SIZE / 2,
          f.y * CELL_SIZE + CELL_SIZE / 2,
          r, 0, Math.PI * 2
        )
        ctx.fill()
      })

      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#2ecc71' : '#4ecca3'
        ctx.fillRect(s.x * CELL_SIZE + 1, s.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2)
      })
    }

    function updateUI() {
      document.getElementById('level').textContent = currentLevel
      document.getElementById('speed').textContent = speedLevel
      document.getElementById('score').textContent = score
      document.getElementById('levelScore').textContent = levelScore
    }

    function changeDirection(dir) {
      if (gameState !== 'playing') return
      
      switch(dir) {
        case 'up':
          if (direction !== DIRECTIONS.DOWN) nextDirection = DIRECTIONS.UP
          break
        case 'down':
          if (direction !== DIRECTIONS.UP) nextDirection = DIRECTIONS.DOWN
          break
        case 'left':
          if (direction !== DIRECTIONS.RIGHT) nextDirection = DIRECTIONS.LEFT
          break
        case 'right':
          if (direction !== DIRECTIONS.LEFT) nextDirection = DIRECTIONS.RIGHT
          break
      }
    }

    function togglePause() {
      if (gameState !== 'playing') return
      isPaused = !isPaused
      document.getElementById('pausedText').classList.toggle('hidden', !isPaused)
      document.getElementById('pauseBtn').textContent = isPaused ? '▶' : '⏸'
    }

    function levelUp() {
      clearInterval(gameLoop)
      
      document.getElementById('completedLevel').textContent = currentLevel
      document.getElementById('nextLevel').textContent = currentLevel + 1
      document.getElementById('levelOverlay').classList.add('active')

      if (difficulty === 'hard') {
        snake = snake.slice(0, Math.max(3, Math.floor(snake.length / 2)))
      }

      setTimeout(() => {
        document.getElementById('levelOverlay').classList.remove('active')
        currentLevel++
        speedLevel = Math.min(speedLevel + 1, 5)
        levelScore = 0
        
        if (difficulty === 'normal') {
          obstacles = []
        }

        foods = []
        for (let i = 0; i < 3; i++) {
          const food = generateFood()
          if (food) foods.push(food)
        }

        updateUI()
        startGameLoop()
        draw()
      }, 2000)
    }

    function gameOver() {
      clearInterval(gameLoop)
      gameState = 'gameover'
      
      document.getElementById('finalLevel').textContent = currentLevel
      document.getElementById('finalScore').textContent = score
      document.getElementById('game').classList.remove('active')
      document.getElementById('gameover').classList.remove('hidden')
    }

    function restartGame() {
      startGame()
    }

    function backToMenu() {
      clearInterval(gameLoop)
      gameState = 'menu'
      
      document.getElementById('game').classList.remove('active')
      document.getElementById('gameover').classList.add('hidden')
      document.getElementById('menu').classList.remove('hidden')
      document.getElementById('levelOverlay').classList.remove('active')
    }

    document.addEventListener('keydown', (e) => {
      if (gameState !== 'playing') return
      
      switch(e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault()
          changeDirection('up')
          break
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault()
          changeDirection('down')
          break
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault()
          changeDirection('left')
          break
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault()
          changeDirection('right')
          break
        case ' ':
          e.preventDefault()
          togglePause()
          break
      }
    })
  </script>
</body>
</html>
